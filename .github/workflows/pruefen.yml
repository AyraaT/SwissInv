name: Prüfen

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: Datenfeldverzeichnis prüfen
        run: python tools/validate.py
      - name: Dokumente erzeugen
        run: python tools/build.py
      - name: Erzeugte Dateien sind aktuell
        run: git diff --exit-code -- docs .github/ISSUE_TEMPLATE
