# Verzeichnis der Auswahllisten in diesem Ordner.
# placeholder  = Liste enthält nur Platzhalter; die echten Werte sind (noch) nicht hinterlegt
lists:
- name: ebkph
  title:
    de: eBKP-H (Referenzauswahl)
    fr: eCCC-Bât (sélection de référence)
    it: eCCC-E (selezione di riferimento)
    en: eBKP-H (reference selection)
  file: ebkph.csv
  note:
    de: Platzhalter. Die Codes und Bezeichnungen nach eBKP-H SN 506 511 sind hier nicht hinterlegt. Die eBKP-H sollte nur in der Ebene Elementgruppe oder Element angegeben werden.
    fr: Valeurs fictives. Les codes et désignations selon eCCC-Bât SN 506 511 ne figurent pas ici. L'eCCC-Bât ne devrait être indiqué qu'au niveau du groupe d'éléments ou de l'élément.
    it: Segnaposto. I codici e le denominazioni secondo eCCC-E SN 506 511 non sono riportati qui. L'eCCC-E andrebbe indicato solo a livello di gruppo di elementi o di elemento.
    en: Placeholders. The codes and labels according to eBKP-H SN 506 511 are not held here. eBKP-H should only be given at the level of element group or element.
